{
  "name": "Offline checks",
  "on": {
    "push": {},
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "PYTHONDONTWRITEBYTECODE": "1"
  },
  "jobs": {
    "offline": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "https://github.com/actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "python3 -m unittest discover -s tests -q",
          "run": "python3 -m unittest discover -s tests -q"
        },
        {
          "name": "examples.py",
          "run": "python3 scripts/examples.py"
        },
        {
          "name": "validate.py --overlay config/config.example.json",
          "run": "python3 scripts/validate.py --overlay config/config.example.json"
        },
        {
          "name": "publish_check.py",
          "run": "python3 scripts/publish_check.py"
        },
        {
          "name": "doc_check.py",
          "run": "python3 scripts/doc_check.py"
        }
      ]
    }
  }
}
