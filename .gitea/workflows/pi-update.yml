{
  "name": "Pi update candidate",
  "on": {
    "schedule": [
      {
        "cron": "23 4 * * *"
      }
    ],
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "PYTHONDONTWRITEBYTECODE": "1"
  },
  "jobs": {
    "detect": {
      "if": "${{ gitea.ref == 'refs/heads/main' }}",
      "runs-on": "ubuntu-latest",
      "outputs": {
        "new": "${{ steps.detect.outputs.new }}",
        "version": "${{ steps.detect.outputs.version }}",
        "current": "${{ steps.detect.outputs.current }}"
      },
      "steps": [
        {
          "uses": "https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "${{ gitea.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "https://github.com/actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "uses": "https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.21.0"
          }
        },
        {
          "id": "detect",
          "run": "python3 scripts/ci_update.py detect --directory .local/ci/detect"
        },
        {
          "name": "Retain detect",
          "if": "${{ always() }}",
          "uses": "https://github.com/actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf",
          "with": {
            "name": "detect",
            "path": ".local/ci/detect/*.json\n.local/ci/detect/*.log",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    },
    "preflight": {
      "needs": [
        "detect"
      ],
      "if": "${{ needs.detect.outputs.new == 'true' }}",
      "runs-on": "ubuntu-latest",
      "outputs": {
        "eligible": "${{ steps.preflight.outputs.eligible }}"
      },
      "steps": [
        {
          "uses": "https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "${{ gitea.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "https://github.com/actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "id": "preflight",
          "env": {
            "UPDATE_VERSION": "${{ needs.detect.outputs.version }}",
            "UPDATE_SERVER": "${{ gitea.server_url }}",
            "UPDATE_REPOSITORY": "${{ gitea.repository }}",
            "UPDATE_TOKEN": "${{ secrets.PI_UPDATE_TOKEN }}"
          },
          "run": "python3 scripts/ci_update.py preflight --directory .local/ci/preflight"
        },
        {
          "name": "Retain preflight",
          "if": "${{ always() }}",
          "uses": "https://github.com/actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf",
          "with": {
            "name": "preflight",
            "path": ".local/ci/preflight/*.json",
            "if-no-files-found": "warn",
            "retention-days": 14
          }
        }
      ]
    },
    "qualify": {
      "needs": [
        "detect",
        "preflight"
      ],
      "if": "${{ needs.detect.outputs.new == 'true' && needs.preflight.outputs.eligible == 'true' }}",
      "runs-on": "ubuntu-latest",
      "env": {
        "UPDATE_VERSION": "${{ needs.detect.outputs.version }}",
        "UPDATE_FROM": "${{ needs.detect.outputs.current }}"
      },
      "steps": [
        {
          "uses": "https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "${{ gitea.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "https://github.com/actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "uses": "https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.21.0"
          }
        },
        {
          "run": "python3 scripts/ci_update.py qualify --directory .local/ci/qualify"
        },
        {
          "name": "Retain qualify",
          "if": "${{ always() }}",
          "uses": "https://github.com/actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf",
          "with": {
            "name": "qualify",
            "path": ".local/ci/qualify/*.json\n.local/ci/qualify/**/*.log",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    },
    "notes": {
      "needs": [
        "detect",
        "preflight"
      ],
      "if": "${{ needs.detect.outputs.new == 'true' && needs.preflight.outputs.eligible == 'true' }}",
      "runs-on": "ubuntu-latest",
      "env": {
        "UPDATE_VERSION": "${{ needs.detect.outputs.version }}",
        "UPDATE_FROM": "${{ needs.detect.outputs.current }}"
      },
      "steps": [
        {
          "uses": "https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "${{ gitea.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "https://github.com/actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "uses": "https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.21.0"
          }
        },
        {
          "run": "python3 scripts/ci_update.py notes --directory .local/ci/notes"
        },
        {
          "name": "Retain notes",
          "if": "${{ always() }}",
          "uses": "https://github.com/actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf",
          "with": {
            "name": "notes",
            "path": ".local/ci/notes/*.json\n.local/ci/notes/**/*.log",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    },
    "request": {
      "needs": [
        "detect",
        "qualify",
        "notes"
      ],
      "if": "${{ needs.detect.outputs.new == 'true' && needs.qualify.result == 'success' && needs.notes.result == 'success' }}",
      "runs-on": "ubuntu-latest",
      "permissions": {
        "contents": "write",
        "pull-requests": "write"
      },
      "steps": [
        {
          "uses": "https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "${{ gitea.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "https://github.com/actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "uses": "https://github.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a",
          "with": {
            "name": "qualify",
            "path": ".local/ci/qualify"
          }
        },
        {
          "uses": "https://github.com/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a",
          "with": {
            "name": "notes",
            "path": ".local/ci/notes"
          }
        },
        {
          "name": "Create the version request",
          "env": {
            "UPDATE_VERSION": "${{ needs.detect.outputs.version }}",
            "UPDATE_FROM": "${{ needs.detect.outputs.current }}",
            "UPDATE_SERVER": "${{ gitea.server_url }}",
            "UPDATE_REPOSITORY": "${{ gitea.repository }}",
            "UPDATE_BASE": "main",
            "UPDATE_REVISION": "${{ gitea.sha }}",
            "UPDATE_TOKEN": "${{ secrets.PI_UPDATE_TOKEN }}"
          },
          "run": "python3 scripts/ci_update.py request --directory .local/ci"
        }
      ]
    }
  }
}
