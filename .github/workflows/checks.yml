{
  "name": "Offline checks",
  "on": {
    "push": {},
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "PYTHONDONTWRITEBYTECODE": "1"
  },
  "jobs": {
    "offline": {
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "os": "ubuntu-latest",
              "python": "3.11"
            },
            {
              "os": "macos-15",
              "python": "3.12"
            }
          ]
        }
      },
      "runs-on": "${{ matrix.os }}",
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "${{ matrix.python }}"
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version-file": "packages/tenantext/package.json"
          }
        },
        {
          "name": "Package dependencies",
          "run": "for package in packages/*/; do\n  if node -e 'process.exit(require(require(\"path\").resolve(process.argv[1], \"package.json\")).scripts?.test ? 0 : 1)' \"$package\"; then\n    npm ci --ignore-scripts --prefix \"$package\"\n  fi\ndone\n"
        },
        {
          "name": "Pi packages at the pin of config/manifest.json",
          "run": "pin=\"$(python3 -c 'import json; print(json.load(open(\"config/manifest.json\"))[\"runtime\"][\"piVersion\"])')\"\nnpm install --ignore-scripts --prefix \"$RUNNER_TEMP/pi\" -- @earendil-works/pi-coding-agent@\"${pin:?}\"\nG=\"$RUNNER_TEMP/pi/node_modules/@earendil-works\"\nmkdir -p packages/tenantext/node_modules/@earendil-works\nfor name in pi-coding-agent pi-ai pi-tui; do\n  source=\"$G/pi-coding-agent/node_modules/@earendil-works/$name\"\n  [ -d \"$source\" ] || source=\"$G/$name\"\n  ln -sfn \"$source\" \"packages/tenantext/node_modules/@earendil-works/$name\"\ndone\n"
        },
        {
          "name": "Betterleaks at the pin of scripts/scan.sh",
          "run": "set -eu\nversion=1.9.0\ncase \"$(uname -s)/$(uname -m)\" in\n  Linux/x86_64) platform=linux_x64; sum=f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7; verify=\"sha256sum -c\" ;;\n  Darwin/arm64) platform=darwin_arm64; sum=83dd7eaab13d44a1e8e347a17064cdef153a1478db473276d41b38d55613d3f2; verify=\"shasum -a 256 -c\" ;;\n  *) echo \"no pinned Betterleaks archive for $(uname -s)/$(uname -m)\" >&2; exit 1 ;;\nesac\narchive=\"betterleaks_${version}_$platform.tar.gz\"\ndir=\"$RUNNER_TEMP/betterleaks\"\nmkdir -p \"$dir/bin\"\ncd \"$dir\"\ncurl -fsSLO \"https://github.com/betterleaks/betterleaks/releases/download/v$version/$archive\"\necho \"$sum  $archive\" | $verify\ntar -xzf \"$archive\" -C bin betterleaks\nbin/betterleaks version\necho \"$dir/bin\" >> \"$GITHUB_PATH\"\n"
        },
        {
          "name": "Offline checks",
          "run": "python3 scripts/check.py --all"
        }
      ]
    }
  }
}
