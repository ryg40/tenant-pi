{
  "name": "Offline checks",
  "on": {
    "push": {},
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "PYTHONDONTWRITEBYTECODE": "1"
  },
  "jobs": {
    "offline": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Check runner Python",
          "run": "python3 -c 'import sys; print(sys.version); sys.exit(0 if sys.version_info[:2] == (3, 11) else \"Python 3.11 is required in the runner image\")'"
        },
        {
          "name": "Offline checks",
          "run": "python3 scripts/check.py"
        }
      ]
    }
  }
}
